function fileSize(value){if(value===undefined||value===null||value==='')return '';const bytes=Number(value);if(!Number.isFinite(bytes)||bytes<0)return String(value).slice(0,30);const units=['B','KB','MB','GB','TB'];let n=bytes,u=0;while(n>=1024&&u<units.length-1){n/=1024;u++}return (u?n.toFixed(1).replace(/\.0$/,''):String(n))+' '+units[u]}
function cardSource(m){const extra=m.extra||{};let host='';try{host=new URL(extra.url).hostname}catch{}const label=extra.source_name||(m.kind==='file'?'文件':m.kind==='location'?'位置':m.kind==='miniprogram'?'小程序':host==='mp.weixin.qq.com'?'公众号文章':host||'网页链接');const map=m.kind==='location'||/地图|位置|map/i.test(label);return {label,kind:map?'map':m.kind==='file'?'wechat':m.kind==='miniprogram'?'mini':host==='mp.weixin.qq.com'?'article':'link'}}
function cardFooter(card,m,source){const footer=element('div','wx-card-footer');const icon=(m.resources||[]).find(r=>r.kind==='image'&&r.role==='source_icon'&&r.status==='available'&&localPath(r.path));if(icon){const img=element('img','wx-source-icon');img.src=icon.path;img.alt='';img.loading='lazy';img.onerror=()=>{const fallback=glyph(source.kind);fallback.classList.add('wx-source-glyph');img.replaceWith(fallback)};footer.append(img)}else{const svg=glyph(source.kind);svg.classList.add('wx-source-glyph');footer.append(svg)}footer.append(element('span','source-label',source.label));card.append(footer);return footer}
function cardThumbnail(m,source,file){const slot=element('div','wx-card-thumb'+(source.kind==='map'?' map':'')+(file?' wx-file-slot':''));if(file){slot.append(fileGlyph(file));return slot}const image=(m.resources||[]).find(r=>r.kind==='image'&&r.role==='thumbnail'&&r.status==='available'&&localPath(r.path));if(image){const img=element('img');img.src=image.path;img.alt='';img.loading='lazy';img.onerror=()=>slot.replaceChildren(glyph(source.kind));slot.append(img)}else slot.append(glyph(source.kind));return slot}
function locationLink(extra){if(link(extra.url))return link(extra.url);const p=extra.location||{},lat=Number(p.latitude),lon=Number(p.longitude);if(p.latitude==null||p.longitude==null||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return '';const url=new URL('https://apis.map.qq.com/uri/v1/marker');url.searchParams.set('marker','coord:'+lat+','+lon+';title:'+(extra.title||'位置')+';addr:'+(extra.description||''));url.searchParams.set('referer','Moect');return url.href}
function renderTransfer(parent,m){const info=m.extra?.transfer||{},state=['pending','received','refunded'].includes(info.state)?info.state:'unknown',card=element('div','wx-transfer '+state),body=element('div','wx-transfer-main');const icon=glyph(state);icon.classList.add('wx-transfer-symbol');body.append(icon);const text=element('div');text.append(element('div','wx-transfer-amount',info.amount||info.amount_text||'转账'),element('div','wx-transfer-state',info.status_text||'转账'));if(info.memo)text.append(element('div','wx-transfer-memo',info.memo));body.append(text);card.append(body,element('div','wx-transfer-footer','微信转账'));parent.append(card);return true}
function renderCard(parent,m){
 if(m.kind==='transfer')return renderTransfer(parent,m);
 const extra=m.extra||{};if(!['link','miniprogram','appmsg','file','location'].includes(m.kind))return false;
 if(m.kind==='appmsg'&&([1,57].includes(Number(extra.appmsg_type))||!link(extra.url)))return false;
 if(m.kind!=='file'&&m.kind!=='location'&&!(extra.title||extra.url||extra.miniprogram))return false;
 const file=m.kind==='file',asset=file?(m.resources||[]).find(r=>r.kind==='file'&&r.status==='available'&&localPath(r.path)):null;
 const href=file?(asset?localPath(asset.path):''):m.kind==='location'?locationLink(extra):link(extra.url),card=element(href?'a':'div','wx-card');
 if(href){card.href=href;if(file)card.download=extra.filename||asset.name;else{card.target='_blank';card.rel='noopener noreferrer'}}
 const source=cardSource(m),body=element('div','wx-card-content'),copy=element('div','wx-card-copy'),name=file?(extra.filename||extra.title||asset?.name||'文件'):(extra.title||(m.kind==='location'?'位置':'分享卡片'));
 copy.append(element('div','wx-card-title',name));
 const description=file?fileSize(extra.filesize||asset?.size):extra.description;
 if(description&&description!==name)copy.append(element('div','wx-card-description',description));
 body.append(copy,cardThumbnail(m,source,file?name:null));card.append(body);const footer=cardFooter(card,m,source);
 if(file&&!asset)footer.append(element('span','wx-card-status',m.resource_status==='skipped'?'已按设置跳过':'未下载'));
 if(m.kind==='miniprogram'&&!href)footer.append(element('span','wx-card-status','在微信中打开'));
 parent.append(card);return true
}
function messageText(m){const placeholders={image:'[图片]',emoji:'[动画表情]',voice:'[语音]'};const text=String(m.text||''),game=m.extra?.game_emoji;if(game&&text==='['+game.label+']'&&m.resources?.some(r=>r.kind==='image'&&r.status==='available'))return '';return placeholders[m.kind]===text.trim()?'':text}
function renderContent(parent,m,withQuote=true){const forward=renderForward(parent,m),card=!forward&&renderCard(parent,m);if(!forward&&!card)textWithLinks(parent,messageText(m));if(card&&parent.classList.contains('bubble'))parent.classList.add('has-card');if(withQuote)renderQuote(parent,m);renderResources(parent,m,r=>!card||(!['thumbnail','source_icon'].includes(r.role)&&!(m.kind==='file'&&r.kind==='file'&&r.status==='available')));if(m.resource_notice)parent.append(element('p','resource-note',m.resource_notice))}
function renderQuote(parent,m){const q=m.quote||m.extra?.reply;if(!q)return;const card=element('blockquote','quote');card.append(element('strong','',(q.sender||'引用消息')+(q.time_str?' · '+q.time_str:'')));renderContent(card,q,false);if(q.server_id&&String(q.server_id)!=='0'){const button=element('button','reply-jump','查看原消息');button.onclick=()=>jump(String(q.server_id));card.append(button)}parent.append(card)}
function isSystemMessage(m){return m.kind==='system'||[10000,10002].includes(Number(m.type))}
function paginationModel(count,current,group=null){const pages=Math.ceil(Math.max(0,count)/size),selected=Math.max(0,Math.min(current,Math.max(0,pages-1))),start=Math.max(0,Math.min(group===null?Math.floor(selected/10)*10:Math.floor(group/10)*10,Math.floor(Math.max(0,pages-1)/10)*10));return {pages,selected,start,numbers:Array.from({length:Math.min(10,Math.max(0,pages-start))},(_,i)=>start+i+1),previousGroup:start>0,nextGroup:start+10<pages}}
function renderPagination(align=true){
 const model=paginationModel(total,page,align?null:pageGroup);pageGroup=model.start;
 const box=$('#page-buttons');box.replaceChildren();
 for(const number of model.numbers){const button=element('button','',number);button.type='button';button.disabled=reading;button.setAttribute('aria-label','第 '+number+' 页');if(number===page+1)button.setAttribute('aria-current','page');button.onclick=()=>goPage(number-1);box.append(button)}
 $('#page-jump-controls').hidden=model.pages<20;
 $('#page-jump').value=String(total?page+1:1);$('#page-jump').max=String(Math.max(1,model.pages));$('#page-jump').disabled=reading||!total;$('#jump-go').disabled=reading||!total;
 $('#page').textContent='第 '+(total?page+1:0)+' / '+model.pages+' 页';
 $('#prev').disabled=reading||!page;$('#next').disabled=reading||page+1>=model.pages;
 for(const [id,available] of [['#prev-group',model.previousGroup],['#next-group',model.nextGroup]]){$(id).hidden=model.pages<=10;$(id).disabled=reading||!available;}
}
async function goPage(index){if(reading)return;page=paginationModel(total,index).selected;const expected=generation+1;await query(false);if(generation===expected)scrollTo(0,0)}
function messageRow(m) {
 const system=isSystemMessage(m),row=element('div','row'+(system?' system':m.is_sender?' me':''));
 row.dataset.messageId=String(m.server_id||'');
 if(system){const notice=element('div','system-text',m.text||'');notice.title=m.time_str||'';row.append(notice);return row}
 const avatar=element('div','avatar',(m.sender||'?').slice(0,1));
 if(localPath(m.avatar)){
  const image=element('img');image.src=m.avatar;image.alt=m.sender;image.loading='lazy';
  image.onerror=()=>{image.remove();avatar.textContent=(m.sender||'?').slice(0,1)};avatar.replaceChildren(image);
 }
 const body=element('div','body'),by=element('div','by',m.sender+' · '+m.time_str),bubble=element('div','bubble');
 renderContent(bubble,m);body.append(by,bubble);row.append(avatar,body);return row;
}
async function printMessages() {
 if(reading||MoectPrint.busy)return;
 const notice=$('#notice'),previous=notice.textContent;
 try{
  const filter=filters();notice.textContent='正在准备当前筛选范围的全部记录…';
  await MoectPrint.print({title:manifest.name+' · 聊天记录',
   description:[$('#meta').textContent,$('#start').value||'不限开始时间',$('#end').value||'不限结束时间',$('#search').value.trim()].filter(Boolean).join(' · '),
   render:async root=>{
    let count=0;
    for(let i=0;i<manifest.chunks.length;i++){
     if(outside(manifest.chunks[i],filter))continue;
     for(const message of await load(i)){if(matches(message,filter)){root.append(messageRow(message));count++}}
     if(i%5===0)await new Promise(resolve=>setTimeout(resolve,0));
    }
    return count;
   }});
  notice.textContent=previous;
 }catch(error){notice.textContent=error.message}
}
function draw(){
 const box=$('#messages');box.replaceChildren();
 for(const m of records)box.append(messageRow(m));
 renderPagination();$('#selection').textContent='匹配 '+total+' 条 · 共 '+manifest.count+' 条';$('#notice').textContent=records.length?'':'没有匹配的消息'
}
function searchable(m){return [m.text,m.sender,m.extra?.title,m.extra?.description,m.extra?.url,m.quote?.text,m.quote?.sender,m.forward?.title,...(m.forward?.preview||[]).map(p=>p.sender+' '+p.text),...(m.resources||[]).map(r=>r.name)].filter(Boolean).join(' ').toLocaleLowerCase()}
function filters(){const q=$('#search').value.trim().toLocaleLowerCase();function stamp(value,end){if(!value)return null;const n=Date.parse(value+'+08:00')/1000;if(!Number.isFinite(n))throw new Error('请选择有效的时间');return n+(end&&value.length===16?59:0)}const start=stamp($('#start').value,false),end=stamp($('#end').value,true);if(start!==null&&end!==null&&end<start)throw new Error('结束时间不能早于开始时间');return {q,start,end}}
function matches(m,f){const ts=Number(m.create_time||0);return (f.start===null||ts>=f.start)&&(f.end===null||ts<=f.end)&&(!f.q||searchable(m).includes(f.q))}
function outside(chunk,f){return (f.start!==null&&chunk.end_time!=null&&chunk.end_time<f.start)||(f.end!==null&&chunk.start_time!=null&&chunk.start_time>f.end)}
async function query(reset=true){
 let f;try{f=filters()}catch(e){$('#notice').textContent=e.message;return}
 const id=++generation,key=JSON.stringify(f);reading=true;renderPagination(false);$('#go').disabled=true;$('#prev').disabled=true;$('#next').disabled=true;$('#notice').textContent='正在读取本地归档…';
 try{
  if(!selection||selection.key!==key){
   const counts=[];let matched=0;
   for(let i=0;i<manifest.chunks.length;i++){
    if(id!==generation)return;const chunk=manifest.chunks[i];let n=0;
    if(outside(chunk,f))n=0;
    else if(!f.q&&f.start===null&&f.end===null)n=chunk.count;
    else{const rows=await load(i);if(id!==generation)return;n=rows.reduce((sum,m)=>sum+(matches(m,f)?1:0),0)}
    counts.push(n);matched+=n;if(i%10===0)await new Promise(r=>setTimeout(r,0));
   }
   if(id!==generation)return;selection={key,counts,total:matched}
  }
  total=selection.total;if(reset)page=Math.max(0,Math.ceil(total/size)-1);page=Math.max(0,Math.min(page,Math.max(0,Math.ceil(total/size)-1)));
  const result=[];let offset=page*size;
  for(let i=0;i<selection.counts.length&&result.length<size;i++){
   const n=selection.counts[i];if(offset>=n){offset-=n;continue}
   const batch=await load(i);if(id!==generation)return;
   for(const m of batch){if(!matches(m,f))continue;if(offset){offset--;continue}result.push(m);if(result.length>=size)break}
  }
  records=result;draw();if(reset)requestAnimationFrame(()=>{if(id===generation)scrollTo(0,document.documentElement.scrollHeight)})
 }catch(e){$('#notice').textContent=e.message}finally{if(id===generation){reading=false;$('#go').disabled=false;renderPagination(false)}}
}
async function jump(target){const id=++generation;let position=0;$('#notice').textContent='正在定位原消息…';try{for(let i=0;i<manifest.chunks.length;i++){const batch=await load(i);if(id!==generation)return;for(const m of batch){if(String(m.server_id)===target){$('#search').value='';$('#start').value='';$('#end').value='';$('#date-range').setAttribute('start','');$('#date-range').setAttribute('end','');page=Math.floor(position/size);await query(false);const row=[...document.querySelectorAll('.row')].find(r=>r.dataset.messageId===target);if(row){row.scrollIntoView({block:'center',behavior:'smooth'});row.classList.add('focused')}return}position++}}$('#notice').textContent='原消息不在本次导出范围，已展示可用的引用内容。'}catch(e){$('#notice').textContent=e.message}}
$('#date-range').addEventListener('range-change',e=>{$('#start').value=e.detail.start;$('#end').value=e.detail.end;query()});
const jumpPage=()=>{const value=Number($('#page-jump').value);if(!Number.isInteger(value)||value<1||value>Math.ceil(total/size)){$('#notice').textContent='请输入有效页码';return}goPage(value-1)};$('#jump-go').onclick=jumpPage;$('#page-jump').onkeydown=event=>{if(event.key==='Enter')jumpPage()};
$('#print').onclick=printMessages;$('#go').onclick=()=>query();for(const input of ['#search','#start','#end'])$(input).onkeydown=e=>{if(e.key==='Enter')query()};$('#reset').onclick=()=>{$('#search').value='';$('#start').value='';$('#end').value='';$('#date-range').setAttribute('start','');$('#date-range').setAttribute('end','');query()};$('#prev').onclick=()=>goPage(page-1);$('#next').onclick=()=>goPage(page+1);$('#prev-group').onclick=()=>{pageGroup-=10;renderPagination(false)};$('#next-group').onclick=()=>{pageGroup+=10;renderPagination(false)};query();
MoectMedia.mount(document.querySelector('#messages'));
</script></html>
