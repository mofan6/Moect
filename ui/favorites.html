<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>微信收藏归档</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#292137;font:14px/1.8 "Microsoft YaHei",sans-serif}header,main,footer{max-width:1100px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px;font-weight:500}button,input,select{font:inherit;color:inherit;background:#fff;border:1px solid #e6deef;border-radius:10px;padding:7px 12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.muted{color:#7e718f;font-size:12px}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}#query{flex:1;min-width:160px}.card{padding:24px;margin:0 0 18px;border:1px solid #e6deef;background:#fff;border-radius:16px;overflow-wrap:anywhere}.card h2{font-size:19px;font-weight:500;margin:8px 0}.copy{white-space:pre-wrap}.block{padding:12px 0;border-top:1px solid #e6deef}.block .block{margin-left:18px}.sender{font-size:12px;color:#7056c4}.resource{display:block;margin:12px 0}.resource img{display:block;max-width:100%;max-height:500px;object-fit:contain;border-radius:8px}.resource video{max-width:100%;max-height:500px}.resource audio{max-width:100%}a{color:#7056c4;overflow-wrap:anywhere}.notice{font-size:12px;color:#7e718f}footer{display:flex;justify-content:center;gap:12px;align-items:center}details>summary{cursor:pointer;color:#7056c4;padding:8px 0}#status{min-height:22px}@media(max-width:650px){header,main,footer{padding:16px}.card{padding:18px}.filters>*{max-width:100%}}
</style>
<header><h1 id="title"></h1><p id="meta" class="muted"></p><p id="notice" class="notice"></p><div class="filters"><input id="query" type="search" placeholder="搜索收藏内容" aria-label="搜索收藏内容"><select id="type" aria-label="收藏类型"><option value="">全部类型</option></select><moect-date-range id="date-range"></moect-date-range><button id="reset">显示全部</button><button id="print">打印 / 保存 PDF</button></div><p id="status" class="muted" role="status"></p><a href="data.json" download>归档 JSON</a> · <a href="resource-report.jsonl" download>资源明细</a></header><main id="items"></main><footer><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></footer>
<script>__DATE_RANGE_PICKER__</script><script>__ARCHIVE_MEDIA__</script><script>__ARCHIVE_PRINT__</script>
<script src="builtin-faces.js"></script><script>__INLINE_FACES__</script>
<script>
const data=__FAVORITES__,$=s=>document.querySelector(s),size=40;let page=0,start='',end='';
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text){if(cls==='copy')MoectFaces.append(el,text);else el.textContent=text}return el}
function local(path){return typeof path==='string'&&!/^[a-z]+:|^[/\\]|\\/i.test(path)&&!path.split('/').includes('..')?path:''}
function external(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)&&!u.username?u.href:''}catch{return ''}}
function link(url,label,isLocal=false){const href=isLocal?local(url):external(url);if(!href)return node('span','',label);const a=node('a','',label);a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a}
function renderBlock(block){const el=node('section','block');if(block.sender)el.append(node('p','sender',[block.sender,block.time].filter(Boolean).join(' · ')));if(block.title)el.append(node('p','',block.title));if(block.text)el.append(node('p','copy',block.text));if(block.link)el.append(link(block.link,'打开原链接'));
for(const r of block.resources||[]){if(!local(r.path))continue;const wrap=node('div','resource');if(r.kind==='image'){const a=link(r.path,'',true),img=node('img');a.className='photo-link';img.src=r.path;img.alt=r.name||'收藏图片';img.loading='lazy';a.append(img);wrap.append(a)}else if(['video','audio'].includes(r.kind)){const media=node(r.kind);media.src=r.path;media.controls=true;media.preload='none';wrap.append(media)}wrap.append(link(r.path,r.name||'下载文件',true));el.append(wrap)}if(block.notice)el.append(node('p','notice',block.notice));for(const child of block.children||[])el.append(renderBlock(child));return el}
function card(item){const el=node('article','card');el.append(node('div','muted',[item.type_name,item.source,item.create_time?new Date(item.create_time*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):''].filter(Boolean).join(' · ')),node('h2','',item.title));if(item.text&&item.text!==item.title)el.append(node('p','copy',item.text));if(item.link)el.append(link(item.link,'打开原链接'));const blocks=node('div');for(const block of item.blocks||[])blocks.append(renderBlock(block));if(item.blocks?.length>6){const detail=node('details'),summary=node('summary','','展开内容（'+item.blocks.length+' 项）');detail.append(summary,blocks);el.append(detail)}else el.append(blocks);if(item.article_notice)el.append(node('p','notice',item.article_notice));if(local(item.markdown))el.append(link(item.markdown,'打开 Markdown 文件',true));return el}
function timestamp(value,last=false){if(value.length===10)value+='T'+(last?'23:59:59':'00:00:00');else if(value.length===16)value+=last?':59':':00';return Date.parse(value+'+08:00')/1000}
function rows(){const query=$('#query').value.trim().toLocaleLowerCase(),type=$('#type').value;return data.items.filter(item=>(!type||String(item.type)===type)&&(!start||item.create_time>=timestamp(start))&&(!end||item.create_time<=timestamp(end,true))&&(!query||JSON.stringify(item).toLocaleLowerCase().includes(query)))}
function render(){const all=rows(),pages=Math.max(1,Math.ceil(all.length/size));page=Math.max(0,Math.min(page,pages-1));$('#items').replaceChildren(...all.slice(page*size,(page+1)*size).map(card));$('#status').textContent='共 '+all.length+' 条收藏';$('#page').textContent=(page+1)+' / '+pages;$('#prev').disabled=page===0;$('#next').disabled=page+1>=pages}
$('#title').textContent=data.name;$('#meta').textContent='由 Moect 导出 · '+data.exported_at;$('#notice').textContent=data.notice;
for(const [id,label] of new Map(data.items.map(item=>[item.type,item.type_name]))){const option=node('option','',label);option.value=id;$('#type').append(option)}
$('#query').oninput=$('#type').onchange=()=>{page=0;render()};$('#date-range').addEventListener('range-change',event=>{start=event.detail.start;end=event.detail.end;page=0;render()});$('#reset').onclick=()=>{$('#query').value=$('#type').value='';start=end='';$('#date-range').setAttribute('start','');$('#date-range').setAttribute('end','');page=0;render()};$('#prev').onclick=()=>{page--;render();scrollTo(0,0)};$('#next').onclick=()=>{page++;render();scrollTo(0,0)};
$('#print').onclick=()=>MoectPrint.print({title:data.name,description:$('#status').textContent,render:root=>{const all=rows();for(const item of all){const el=card(item);for(const details of el.querySelectorAll('details'))details.open=true;root.append(el)}return all.length}});
render();MoectMedia.mount($('#items'));
</script></html>
